name: Release

# Push a tag to release everywhere:   git tag v1.2.3 && git push origin v1.2.3
#   build -> Chrome Web Store + Firefox Add-ons (in parallel) -> GitHub release
# The GitHub release is only created once both store submissions succeed.
# The tag must point at a commit on main, or the run fails before submitting.
#
# Or run manually from the Actions tab for a dry run: builds the zips and
# uploads them as a downloadable artifact; nothing is submitted or released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the tag can be checked against main

      # Stores only ever receive builds from main. A tag pushed on testing (or
      # anywhere else) fails here, before any store job can start.
      - name: Tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Merge testing into main, then tag the main commit."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version, parity, and syntax checks
        run: .github/scripts/check.sh

      - name: Unit tests
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build zips and release notes
        run: .github/scripts/build.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: dist/

  chrome-web-store:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: stores
    permissions:
      contents: read
      id-token: write   # lets the job request GitHub's identity token for Google
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: release-build
          path: dist

      - name: Get a Google access token (Workload Identity Federation, no stored key)
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for review
        env:
          TOKEN: ${{ steps.gcp.outputs.access_token }}
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
          ITEM: ${{ vars.CWS_EXTENSION_ID }}
        run: .github/scripts/chrome-publish.sh dist/*-chrome_v*.zip

  firefox-addons:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: stores
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-build
          path: dist

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Submit to addons.mozilla.org for review and signing
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir firefox-src
          unzip -q dist/*-firefox_v*.zip -d firefox-src
          # --approval-timeout 0: submit and finish; AMO reviews and signs on its own schedule
          npx --yes web-ext sign --source-dir firefox-src --channel listed --approval-timeout 0

  github-release:
    needs: [build, chrome-web-store, firefox-addons]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-build
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            --verify-tag
